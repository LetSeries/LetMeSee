name: Release

# main 分支每次 push 自动构建并发布 Release，无需手动打 tag。
on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10'

      - name: Build plugin
        run: gradle clean build --no-daemon

      - name: Resolve version
        id: version
        run: |
          # 版本号以构建产物为准：即使 build.gradle.kts 的写法变了也不会解析错
          JARS=$(ls build/libs/letmesee-*.jar 2>/dev/null || true)
          COUNT=$(printf '%s\n' "$JARS" | grep -c . || true)
          if [ "$COUNT" -ne 1 ]; then
            echo "期望恰好一个构建产物，实际 $COUNT 个：$JARS"
            exit 1
          fi
          JAR="$JARS"
          # 兼容 version: 1.2.3 / version: "1.2.3" / version: '1.2.3'
          VERSION=$(unzip -p "$JAR" plugin.yml \
            | sed -n "s/^version:[[:space:]]*[\"']\{0,1\}\([^\"']*\)[\"']\{0,1\}[[:space:]]*$/\1/p" \
            | head -1)
          if [ -z "$VERSION" ]; then
            echo "无法从 $JAR 的 plugin.yml 解析版本号"
            exit 1
          fi
          echo "从 $JAR 解析到版本 $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=v$VERSION-$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "jar=$JAR" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: letmesee ${{ steps.version.outputs.tag }} (${{ github.sha }})
          body: |
            自动构建发布。

            - 提交: ${{ github.sha }}
            - 分支: ${{ github.ref_name }}
          files: ${{ steps.version.outputs.jar }}
          fail_on_unmatched_files: true
