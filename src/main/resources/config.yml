# 是否启用容器查看（/lms 准星模式与坐标模式）
container-view: true
# 是否启用玩家库存查看（/lms inv|ec）
player-view: true
# 准星模式 (/lms) 的最大距离，范围 1~64，非法值自动回退为 10
max-target-distance: 10
# 是否在控制台记录审计日志（谁在何时查看了哪个目标）
audit-log: true
# 是否同时追加写入插件数据目录下的 audit.log；默认关闭。文件只追加，轮转/清理由服主负责。
audit-file: false
# 只读视图自动刷新间隔（秒），容器变化后自动同步到视图。
# 设为 0 关闭自动刷新。范围 0~60，默认 5 秒。
# 内容没有变化时不会重写视图，避免无谓的客户端刷新。
refresh-interval-seconds: 5
