name: "letmesee"
version: "${version}"
main: "com.letmesee.LetMeSee"
api-version: "1.21"
folia-supported: true

commands:
  lms:
    description: "只读查看任意容器的物品"
    usage: "/lms [世界 X Y Z] / /lms inv|ec <玩家> / /lms reload"
    # 注意：此处不声明 permission，权限由 LMSCommand 按子命令分别检查
    #（letmesee.use 查看容器，letmesee.player 查看玩家库存，letmesee.reload 重载配置）

permissions:
  letmesee.use:
    description: "允许只读查看容器"
    default: op
  letmesee.reload:
    description: "允许使用 /lms reload 重载配置"
    default: op
  letmesee.player:
    description: "允许使用 /lms inv|ec 查看玩家库存"
    default: op
